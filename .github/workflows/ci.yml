name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest -q
        working-directory: python
      - run: python -m ruff check src tests
        working-directory: python
        if: matrix.os == 'ubuntu-latest'

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: viewer
      - run: pnpm run typecheck
        working-directory: viewer
      - run: pnpm test
        working-directory: viewer
      - run: pnpm run build
        working-directory: viewer

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_clean.py

  package:
    needs: [python, viewer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cd viewer && pnpm install --frozen-lockfile && pnpm run build
      - run: rm -rf python/src/agentplay/viewer && cp -r viewer/dist python/src/agentplay/viewer
      - run: python -m pip install build && python -m build python
      - name: smoke-test the wheel and the sdist
        run: |
          for dist in python/dist/*.whl python/dist/*.tar.gz; do
            rm -rf /tmp/w && python -m venv /tmp/w && /tmp/w/bin/pip install "$dist"
            /tmp/w/bin/agentplay --version
            /tmp/w/bin/python -c "import agentplay.server as s; assert s.viewer_root() is not None, 'viewer not bundled'; assert (s.viewer_root() / 'THIRD_PARTY_LICENSES.txt').is_file(), 'viewer licenses not bundled'"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
